domain: alpha.github.io       # if you want to force HTTPS, specify the domain without the http at the start, e.g. example.com
url: https://alpha.github.io  # the base hostname and protocol for your site, e.g. http://example.com
baseurl: /pager/      # place folder name if the site is served in a subfolder

theme: jekyll-theme-modernist
title: Pager homepage
description: Bookmark this to keep an eye on my project updates!
# rdiscount, kramdown, redcarpet
markdown: kramdown

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: nav
  - scope:
      path: ""
      type: posts
    values:
      layout: nav
